name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brisk
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: brisk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brisk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: brisk
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: brisk
      POSTGRES_APP_PASSWORD: changeme_app

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: cp .env.example .env

      # brisk_app needs a secret (POSTGRES_APP_PASSWORD), so it can't be baked
      # into a checked-in migration — same script used for local dev.
      - name: Bootstrap brisk_app role
        env:
          PGHOST: localhost
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: bash db/init/000_roles.sh

      - run: pnpm --filter @brisk/postgres-db run db:migrate
        env:
          POSTGRES_HOST: localhost

      - run: pnpm exec nx format:check --base=origin/main
      - run: pnpm exec nx run-many -t lint test build typecheck
        env:
          POSTGRES_HOST: localhost
