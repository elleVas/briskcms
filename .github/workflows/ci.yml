name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: brisk
      POSTGRES_DB: brisk

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # GitHub Actions doesn't expose repository secrets to workflows triggered
      # by Dependabot (by design, to stop a malicious dependency bump from
      # exfiltrating them) — so a services:-block password sourced from
      # secrets.* silently comes through empty on every Dependabot PR. Instead,
      # generate a random password here, in-job, for every run regardless of
      # trigger: never a literal value anywhere, never dependent on secrets
      # access at all.
      - name: Start Postgres
        run: |
          admin_password=$(openssl rand -hex 24)
          app_password=$(openssl rand -hex 24)
          echo "::add-mask::$admin_password"
          echo "::add-mask::$app_password"
          echo "POSTGRES_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          echo "POSTGRES_APP_PASSWORD=$app_password" >> "$GITHUB_ENV"

          docker run -d --name postgres \
            -e POSTGRES_USER="$POSTGRES_USER" \
            -e POSTGRES_PASSWORD="$admin_password" \
            -e POSTGRES_DB="$POSTGRES_DB" \
            -p 5432:5432 \
            postgres:16-alpine

          until docker exec postgres pg_isready -U "$POSTGRES_USER" >/dev/null 2>&1; do
            sleep 1
          done

      - name: Bootstrap brisk_app role
        env:
          PGHOST: localhost
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: bash db/init/000_roles.sh

      - run: pnpm --filter @brisk/postgres-db run db:migrate
        env:
          POSTGRES_HOST: localhost

      - run: pnpm exec nx format:check --base=origin/main
      - run: pnpm exec nx run-many -t lint test build typecheck
        env:
          POSTGRES_HOST: localhost
