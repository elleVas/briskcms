name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: brisk
      POSTGRES_DB: brisk
      # Not secrets — see docs/adr/0002 and the "TEMPORARY" note on
      # StaticTenantContextAdapter. Any fixed UUIDs work; these just need to
      # be consistent across the seed step and the test run.
      DEFAULT_TENANT_ID: 31329174-2ede-4151-be9d-a3e765d21e1f
      DEFAULT_SITE_ID: 568b7d6a-3483-45f2-83f1-3b31b433c5eb

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # GitHub Actions doesn't expose repository secrets to workflows triggered
      # by Dependabot (by design, to stop a malicious dependency bump from
      # exfiltrating them) — so a services:-block password sourced from
      # secrets.* silently comes through empty on every Dependabot PR. Instead,
      # generate a random password here, in-job, for every run regardless of
      # trigger: never a literal value anywhere, never dependent on secrets
      # access at all.
      - name: Start Postgres
        run: |
          admin_password=$(openssl rand -hex 24)
          app_password=$(openssl rand -hex 24)
          echo "::add-mask::$admin_password"
          echo "::add-mask::$app_password"
          echo "POSTGRES_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          echo "POSTGRES_APP_PASSWORD=$app_password" >> "$GITHUB_ENV"

          docker run -d --name postgres \
            -e POSTGRES_USER="$POSTGRES_USER" \
            -e POSTGRES_PASSWORD="$admin_password" \
            -e POSTGRES_DB="$POSTGRES_DB" \
            -p 5432:5432 \
            postgres:16-alpine

          # The official image starts Postgres twice: once internally to run
          # initdb, then for real. pg_isready can report ready during that
          # first, transient instance, right before it shuts down to restart
          # — a bare "until pg_isready" loop can catch that window and then
          # get "server closed the connection unexpectedly" on the very next
          # command. Wait for the *second* "ready to accept connections" in
          # the logs, which only appears once the real server is up.
          until [ "$(docker logs postgres 2>&1 | grep -c 'database system is ready to accept connections')" -ge 2 ]; do
            sleep 1
          done

      - name: Bootstrap brisk_app role
        env:
          PGHOST: localhost
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: bash db/init/000_roles.sh

      - run: pnpm --filter @brisk/postgres-db run db:migrate
        env:
          POSTGRES_HOST: localhost

      - run: pnpm --filter @brisk/postgres-db run db:seed
        env:
          POSTGRES_HOST: localhost

      - run: pnpm exec nx format:check --base=origin/main
      - run: pnpm exec nx run-many -t lint test build typecheck
        env:
          POSTGRES_HOST: localhost
