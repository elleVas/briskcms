packages:
  - 'apps/*'
  - 'libs/*'
  - 'libs/adapters/*'

# A bump of astro or @nx/vite pulls in its own vite resolution, separate
# from the one apps/editor-app imports directly — two coexisting vite
# instances in the same pnpm store. TypeScript then sees
# @tanstack/router-plugin's Plugin (built against the new instance) as
# nominally different from editor-app's own Plugin import (old instance),
# and the resulting structural comparison overflows ("Excessive stack
# depth comparing types 'Plugin<any>[]' and 'Plugin<any>[]'" in
# vite.config.mts). Forcing one single vite version workspace-wide is the
# real fix (a vite.config.mts type workaround was tried and didn't help —
# the mismatch is between two different vite installs, not an inference
# depth limit on one).
overrides:
  vite: 8.2.2

# sharp is astro:assets' default image service (apps/public-site) — its
# install script wires up the prebuilt native binary for the current
# platform, no compilation involved. Without this, pnpm silently skips
# that script and astro:assets fails at request time with MissingSharp.
onlyBuiltDependencies:
  - sharp
