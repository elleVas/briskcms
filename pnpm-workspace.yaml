packages:
  - 'apps/*'
  - 'libs/*'
  - 'libs/adapters/*'

# Un bump di @nx/vite (o di astro) tira dentro una propria risoluzione di
# vite separata da quella usata direttamente da apps/editor-app, lasciando
# due istanze coesistenti nello store pnpm. TypeScript vede allora il
# Plugin di @tanstack/router-plugin (costruito contro l'istanza nuova)
# come nominalmente diverso dal Plugin importato da editor-app (istanza
# vecchia), e il confronto strutturale va in "Excessive stack depth"
# (vite.config.mts). Forzare una singola versione di vite in tutto il
# workspace è il fix reale, non un workaround sui tipi in vite.config.mts
# (già provato, non risolve: il problema è tra due install diverse, non
# un limite di profondità dell'inferenza).
overrides:
  vite: 8.2.2
