# docs/adr/0042 — serves the editor-app static SPA build.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA fallback: any path that isn't a real static file resolves to
    # index.html, so client-side routing (TanStack Router) handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames (Vite's own convention) are safe to cache
    # forever — a content change always ships under a new filename.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
